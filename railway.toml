# Railway config-as-code for the CTMS API (server/). Docs: docs/v1/deploy.md
#
# Why Railway (not Render): the team already deployed CTMS there; services do not
# sleep unless "serverless" is switched on (Render's free tier sleeps after
# 15 minutes idle, which breaks live tracking and WebSockets); WebSockets work
# through the edge; the Dockerfile path is set here, so the monorepo needs no
# extra settings. Cost: Railway has no permanent free tier (trial credit, then
# the Hobby plan), see deploy.md. The keep-alive workflow still runs, as the
# runbook asks, and doubles as the uptime check.
#
# Two Railway environments, `staging` and `production`, each with its own
# variables (separate Supabase DB, Firebase and Google Cloud projects; runbook p.1).
# Secrets are set in the Railway dashboard, never here.
#
# Build context is the repo root (the image runs supabase/migrations/*.sql).

[build]
builder = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"
# Only rebuild when the server or the SQL changes (not on app/ or docs/ commits).
watchPatterns = ["server/**", "supabase/migrations/**", "railway.toml"]

[deploy]
# The image CMD runs `alembic upgrade head` first, then ONE uvicorn worker.
# Railway only switches traffic once /health returns 200 (DB reachable), so a
# failed migration or a bad config leaves the previous deployment serving.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Live state, the WebSocket hub, rate limits and jobs are in-process: exactly one
# replica (TRD). Never scale this service horizontally.
numReplicas = 1
