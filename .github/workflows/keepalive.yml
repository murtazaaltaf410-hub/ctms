# Keep-alive + uptime check (runbook deployment step 6 and "Monitoring").
#
# Pings GET /health every 10 minutes during service hours. Service hours are
# not fixed in the docs ("set with the university", PRD); this assumes
# 06:30-19:30 Asia/Kolkata, Monday-Saturday. IST = UTC+5:30, so the UTC cron
# window is 01:00-13:59 (= 06:30-19:29 IST). Edit the cron when the university
# confirms the hours (docs/v1/runbook.md "Keep-alive").
#
# Setup: repository Settings -> Secrets and variables -> Actions -> Variables:
#   KEEPALIVE_URLS = "https://<prod-host>/health https://<staging-host>/health"
# A failed ping fails the run, and GitHub emails the repo admins: that is the
# uptime alert. GitHub may start scheduled runs a few minutes late, and turns
# schedules off after 60 days without commits (re-enable in the Actions tab).
name: Keep-alive

on:
  schedule:
    - cron: "*/10 1-13 * * 1-6"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: vars.KEEPALIVE_URLS != ''
    steps:
      - name: GET /health
        env:
          URLS: ${{ vars.KEEPALIVE_URLS }}
        run: |
          status=0
          for url in $URLS; do
            # 3 tries: a sleeping free-tier host can take ~30 s to wake.
            if curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 60 "$url"; then
              echo " <- ok $url"
            else
              echo "::error::health check failed: $url"
              status=1
            fi
          done
          exit $status
