# CI for CTMS V1 (runbook: "merge to main only after the automated tests pass").
#   server: ruff + pytest against Postgres 16 with supabase/migrations applied to ctms_test
#   docker: builds the server image exactly as Render does (repo-root context)
#   app:    flutter analyze + flutter test (P7)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      # conftest.py reads TEST_DATABASE_URL (same db layout as docker-compose.dev.yml's ctms_test).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ctms_test
      APP_ENV: test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Create ctms_test and apply supabase/migrations (mirrors supabase/docker/04_test_db.sql)
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "create database ctms_test"
          psql -h localhost -U postgres -d ctms_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/0001_schema.sql \
            -f supabase/migrations/0002_rls.sql
          # 0003 without the optional demo data, like the dev test db.
          PGOPTIONS="-c ctms.seed_demo=off" \
            psql -h localhost -U postgres -d ctms_test -v ON_ERROR_STOP=1 -f supabase/migrations/0003_seed.sql
          # 0004 adds users.firebase_uid (Firebase email auth).
          psql -h localhost -U postgres -d ctms_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/0004_firebase_email.sql \
            -f supabase/migrations/0005_trip_direction.sql \
            -f supabase/migrations/0006_pickups.sql

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install (locked)
        working-directory: server
        run: uv sync --locked

      - name: Ruff
        working-directory: server
        run: uv run ruff check .

      - name: Pytest
        working-directory: server
        run: uv run pytest -q

      - name: Alembic upgrade on a fresh database (deploy path)
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ctms_alembic
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "create database ctms_alembic"
          uv run alembic upgrade head
          uv run alembic upgrade head   # second run is a no-op

  docker:
    name: Docker build (server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image (repo-root context, as Render builds it)
        run: docker build -f server/Dockerfile -t ctms-server:ci .

  app:
    name: App (flutter analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9   # app/pubspec.yaml needs Dart ^3.13.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  # Release/APK builds stay manual for now: they need google-services.json and the
  # Maps key, which are gitignored. To add one later, write the file from a secret
  # (base64) and build with:
  #   flutter build apk --flavor staging --dart-define=API_BASE_URL=... \
  #     --dart-define=GOOGLE_SERVER_CLIENT_ID=... --dart-define=OTP_MODE=firebase
