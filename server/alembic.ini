# Alembic is only a runner for the hand-written SQL in supabase/migrations/
# (ADR-2). Each revision executes one SQL file. Run from anywhere:
#   DATABASE_URL=postgresql://... uv run alembic -c server/alembic.ini upgrade head
# Requires (Phase 2 deps): alembic, sqlalchemy>=2, psycopg[binary]>=3.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# sqlalchemy.url is NOT set here: env.py reads the DATABASE_URL env var.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
