# =====================================================================
# CTMS reverse proxy — serves the React SPA and proxies API + websockets
# to the Node backend (service name "api" on the compose network).
# =====================================================================
upstream ctms_api {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    # ---- security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # For HTTPS deployments, also enable HSTS at the TLS terminator:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    client_max_body_size 2m;

    root /usr/share/nginx/html;
    index index.html;

    # ---- REST API ----
    location /api/ {
        proxy_pass http://ctms_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Socket.IO (websocket upgrade) ----
    location /socket.io/ {
        proxy_pass http://ctms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;   # keep long-lived sockets alive
    }

    # ---- static assets (hashed) get long cache ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback: every other route -> index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
